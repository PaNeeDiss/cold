<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#12272e">
  <meta name="description" content="算得清：简单好懂的个人商品进货、销售、支出和利润记账本。">
  <title>算得清 · 我的生意账本</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-icon" aria-hidden="true">算</span><div><strong>算得清</strong><small>我的生意账本</small></div></div>
      <div>
        <div class="side-label">你的工作台</div>
        <nav class="nav-list" id="navList" aria-label="页面">
          <button class="nav-link active" type="button" data-nav="overview"><span class="nav-icon" aria-hidden="true">⌂</span>首页</button>
          <button class="nav-link" type="button" data-nav="products"><span class="nav-icon" aria-hidden="true">▦</span>我的商品</button>
          <button class="nav-link" type="button" data-nav="ledger"><span class="nav-icon" aria-hidden="true">⇄</span>收支流水</button>
          <button class="nav-link" type="button" data-nav="analytics"><span class="nav-icon" aria-hidden="true">▤</span>利润明细</button>
        </nav>
      </div>
      <div class="side-bottom">
        <span class="privacy-chip"><i class="live-dot" aria-hidden="true"></i>仅保存在这台电脑的浏览器</span>
        <div class="side-backup">
          <strong>别忘了保存账本</strong>
          <p>清除浏览器数据可能会丢失记录，建议定期备份。</p>
          <button class="side-export" type="button" data-action="export-json">下载账本备份 ↗</button>
        </div>
        <span class="side-version">v1.1 · 离线版</span>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">我的账本 / <strong id="crumb">首页</strong></div>
        <div class="top-actions">
          <span class="currency-pill">USD <span>·</span> 美元</span>
          <button class="btn btn-ghost hide-mobile" type="button" data-action="import-json">导入旧账本</button>
          <button class="btn btn-primary" type="button" data-action="add-sale">＋ 记销售</button>
        </div>
      </header>
      <main id="view" class="content" aria-live="polite"></main>
      <footer class="footer">算得清 · 数据保存在本机 · 按 FIFO 先进先出计算商品成本</footer>
    </div>
  </div>
  <dialog id="entryDialog" class="entry-dialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><div><span class="eyebrow">新增记账</span><h2 id="dialogTitle"></h2></div>
      <button class="close-button" type="button" data-action="close-dialog" aria-label="关闭">×</button>
    </div>
    <form id="entryForm" novalidate>
      <div id="formFields"></div>
      <div class="form-alert" id="formError" role="alert" hidden></div>
      <div class="form-actions">
        <button class="btn btn-ghost" type="button" data-action="close-dialog">取消</button>
        <button class="btn btn-primary" id="submitText" type="submit">保存这笔记录</button>
      </div>
    </form>
  </dialog>
  <input type="file" id="importInput" accept=".json,application/json" hidden>
  <div class="toast" role="status" id="toast"></div>
  <script src="src/logic.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
